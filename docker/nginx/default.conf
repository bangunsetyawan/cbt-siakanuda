# CBT SIAKANUDA — Nginx untuk smknuda2
# Melayani public/ di port 80 (pintu offline LAN) dan meneruskan PHP ke php:9000.
# Pintu online (Cloudflare Tunnel) mengarah ke port 80 container ini — tanpa ubah file ini.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Upload soal (gambar/audio) — batas 20 MB per file.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    # Jangan layani file tersembunyi (.env, .git, dsb.).
    location ~ /\. {
        deny all;
    }
}
